name: CI

on:
  push:
    paths-ignore:  # notes only. README.md is checked, so it still runs CI
      - "docs/**"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "DECISIONS.md"
      - "BLOCKERS.md"
      - "HANDOVER.md"
      - "PROGRESS.md"
      - "PROJECT_CONTEXT.md"
      - "CLAUDE.md"
  pull_request:
    paths-ignore:  # notes only. README.md is checked, so it still runs CI
      - "docs/**"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "DECISIONS.md"
      - "BLOCKERS.md"
      - "HANDOVER.md"
      - "PROGRESS.md"
      - "PROJECT_CONTEXT.md"
      - "CLAUDE.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv
      - name: init.sh (install, lint, all tests offline)
        run: ./init.sh
      - name: Oracle over MCP solves every task and the wrong agents fail
        run: .venv/bin/toolcut oracle --transport mcp --out out/ci-oracle.json
      - name: Fixture replay of the scripted run
        run: .venv/bin/toolcut replay --out out/ci-replay
      - name: README tables match the results files
        run: .venv/bin/toolcut readme --check
      - name: Results page and social preview match the results files
        run: |
          .venv/bin/python scripts/make_site.py --check
          .venv/bin/python scripts/make_social_preview.py --check
      - name: Links
        run: .venv/bin/python scripts/check_links.py
